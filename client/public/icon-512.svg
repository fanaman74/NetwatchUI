<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cyanGlow512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with Apple squircle curvature -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#30363d" stroke-width="4" />

  <!-- Concentric Radar Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="3" stroke-dasharray="10 10" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="rgba(0, 210, 255, 0.3)" stroke-width="3" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(0, 210, 255, 0.45)" stroke-width="3" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="rgba(0, 210, 255, 0.2)" stroke-width="3" />
  <line x1="50" y1="256" x2="462" y2="256" stroke="rgba(0, 210, 255, 0.2)" stroke-width="3" />

  <!-- Radar Sweep Beam -->
  <path d="M256 256 L386 126 A185 185 0 0 1 441 256 Z" fill="rgba(0, 210, 255, 0.18)" />

  <!-- Active Blips with glow -->
  <circle cx="360" cy="172" r="12" fill="#3fb950" filter="url(#glow512)" />
  <circle cx="180" cy="330" r="9" fill="#00d2ff" filter="url(#glow512)" />
  <circle cx="320" cy="346" r="8" fill="#ffa500" filter="url(#glow512)" />

  <!-- Central Core Centerpoint -->
  <circle cx="256" cy="256" r="18" fill="url(#cyanGlow512)" filter="url(#glow512)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
