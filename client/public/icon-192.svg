<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with Apple squircle curvature -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Concentric Radar Rings -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="96" cy="96" r="48" fill="none" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5" />
  <circle cx="96" cy="96" r="26" fill="none" stroke="rgba(0, 210, 255, 0.45)" stroke-width="1.5" />

  <!-- Radar Crosshairs -->
  <line x1="96" y1="20" x2="96" y2="172" stroke="rgba(0, 210, 255, 0.2)" stroke-width="1.5" />
  <line x1="20" y1="96" x2="172" y2="96" stroke="rgba(0, 210, 255, 0.2)" stroke-width="1.5" />

  <!-- Radar Sweep Beam (45-degree wedge) -->
  <path d="M96 96 L145 47 A70 70 0 0 1 166 96 Z" fill="rgba(0, 210, 255, 0.18)" />

  <!-- Active Blips -->
  <circle cx="135" cy="65" r="4.5" fill="#3fb950" filter="url(#glow)" />
  <circle cx="68" cy="125" r="3.5" fill="#00d2ff" filter="url(#glow)" />
  <circle cx="120" cy="130" r="3" fill="#ffa500" filter="url(#glow)" />

  <!-- Central Core Centerpoint -->
  <circle cx="96" cy="96" r="7" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="96" cy="96" r="2.5" fill="#ffffff" />
</svg>
